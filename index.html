<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#EDE8DE">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KuchennyPlan</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="styles.css" rel="stylesheet">
</head>
<body>
<div class="phone-frame">
  <div class="organic-bg"></div>
  <div class="content">
    <!-- Status Bar -->
    <div class="status-bar">
      <span>9:41</span>
      <div class="dynamic-island"></div>
      <div class="status-icons">
        <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M2 17h20v2H2zm1.15-4.05L4 11.92V7a8 8 0 0 1 16 0v4.92l.85 1.03a1 1 0 0 1-.78 1.63H3.93a1 1 0 0 1-.78-1.63z"/></svg>
      </div>
    </div>

    <!-- Scrollable Content -->
    <div class="scroll-main" id="views">
      <!-- DASHBOARD -->
      <section id="view-dashboard">
        <div class="screen-header">
        <div style="display:flex;align-items:center;gap:8px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <h1>Plan Dnia</h1>
          </div>
          <span class="date-label" id="dash-date"></span>
        </div>

        <div id="dash-users"></div>

        <div id="dash-meals"></div>

        <div class="card" id="dash-water">
          <div class="water-header">
            <div class="water-header-left">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
              <span>Woda dzisiaj</span>
            </div>
            <div class="water-header-right">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5297C7" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6V2"/><path d="M6 9H3"/><path d="M18 9h3"/><path d="M9 21h6"/><path d="M12 21v-6a3 3 0 0 1 3-3h3a3 3 0 0 1 3 3v6"/><path d="M3 18h3a3 3 0 0 1 3 3v2"/></svg>
              <span class="ml-count" id="dash-water-count">0 ml</span>
            </div>
          </div>
          <div class="water-glass-wrap">
            <div class="water-glass">
              <div class="ice-cube">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5297C7" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="3"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
            </div>
            </div>
          </div>
          <div class="water-actions">
            <button class="btn-water" onclick="app.water.add(200)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h12a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v1a1 1 0 0 0 1 1Z"/><path d="M7 16.7A5 5 0 0 1 4 12a5 5 0 0 1 5-5 5 5 0 0 1 4.3 2.5"/><path d="M4.5 18.3A5 5 0 0 0 4 20"/><line x1="15" y1="9" x2="20" y2="4"/><line x1="20" y1="9" x2="15" y2="4"/></svg>
              200ml
            </button>
            <button class="btn-water" onclick="app.water.add(300)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 7.5 12 2l-5.5 5.5a6.5 6.5 0 1 0 11 0Z"/><line x1="12" y1="10" x2="12" y2="14"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
              300ml
            </button>
            <button class="btn-water" onclick="app.water.add(500)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6V2"/><path d="M6 9H3"/><path d="M18 9h3"/><path d="M9 21h6"/><path d="M12 21v-6a3 3 0 0 1 3-3h3a3 3 0 0 1 3 3v6"/><path d="M3 18h3a3 3 0 0 1 3 3v2"/></svg>
              500ml
            </button>
          </div>
          <button class="water-reminder" onclick="app.water.remind()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            Wypij pół szklanki wody!
          </button>
        </div>
      </section>

      <!-- MEAL PLAN -->
      <section id="view-mealplan" style="display:none">
        <div class="screen-header">
          <div style="display:flex;align-items:center;gap:8px">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <h1>Plan Tygodnia</h1>
          </div>
          <button class="btn-sm" onclick="app.mealplan.generateWeek()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:2px"><polyline points="20 6 9 17 4 12"/><path d="M20 6v6"/><path d="M16 6h4v4"/></svg>
            Generuj
          </button>
        </div>
        <div id="week-tabs" class="week-tabs" style="margin-top:8px"></div>
        <div id="day-detail"></div>
      </section>

      <!-- PANTRY -->
      <section id="view-pantry" style="display:none">
        <div class="screen-header">
          <div style="display:flex;align-items:center;gap:8px">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/><line x1="6" y1="17" x2="18" y2="17"/></svg>
            <h1>Spiżarnia</h1>
          </div>
          <button class="btn-sm" onclick="app.pantry.showAddForm()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:2px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            Dodaj
          </button>
        </div>
        <div id="pantry-filter" class="pantry-filter"></div>
        <div id="pantry-items" class="pantry-grid"></div>
      </section>

      <!-- WATER FULL -->
      <section id="view-water" style="display:none">
        <div class="screen-header">
          <div style="display:flex;align-items:center;gap:8px">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
            <h1>Nawodnienie</h1>
          </div>
        </div>
        <div class="card" style="text-align:center">
          <div class="water-circle-container">
            <svg class="water-circle" viewBox="0 0 120 120">
              <circle cx="60" cy="60" r="54" fill="none" stroke="#E5ECE5" stroke-width="8"/>
              <circle id="water-progress" cx="60" cy="60" r="54" fill="none" stroke="#3B9EE5" stroke-width="8" stroke-dasharray="339.292" stroke-dashoffset="339.292" stroke-linecap="round" transform="rotate(-90 60 60)"/>
              <text x="60" y="56" text-anchor="middle" fill="#1F2621" font-size="22" font-weight="bold" id="water-circle-ml">0</text>
              <text x="60" y="76" text-anchor="middle" fill="#68776D" font-size="12">ml</text>
            </svg>
          </div>
          <div class="water-stats">
            <div>Cel: <strong style="color:#1F2621">2000 ml</strong></div>
            <div id="water-cups-today">0 szklanek dzisiaj</div>
            <div id="water-last-reminder"></div>
          </div>
          <div class="water-actions-lg">
            <button class="btn-water-lg" onclick="app.water.add(200)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><path d="M8 21h12a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v1a1 1 0 0 0 1 1Z"/><path d="M7 16.7A5 5 0 0 1 4 12a5 5 0 0 1 5-5 5 5 0 0 1 4.3 2.5"/><path d="M4.5 18.3A5 5 0 0 0 4 20"/><line x1="15" y1="9" x2="20" y2="4"/><line x1="20" y1="9" x2="15" y2="4"/></svg>
              200ml
            </button>
            <button class="btn-water-lg" onclick="app.water.add(300)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><path d="M17.5 7.5 12 2l-5.5 5.5a6.5 6.5 0 1 0 11 0Z"/><line x1="12" y1="10" x2="12" y2="14"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
              300ml
            </button>
            <button class="btn-water-lg" onclick="app.water.add(500)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><path d="M12 6V2"/><path d="M6 9H3"/><path d="M18 9h3"/><path d="M9 21h6"/><path d="M12 21v-6a3 3 0 0 1 3-3h3a3 3 0 0 1 3 3v6"/><path d="M3 18h3a3 3 0 0 1 3 3v2"/></svg>
              500ml
            </button>
            <button class="btn-water-lg reset" onclick="app.water.reset()">Reset</button>
          </div>
          <div class="water-history">
            <h3>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
              Historia dzisiaj
            </h3>
            <div id="water-log"></div>
          </div>
        </div>
      </section>

      <!-- SETTINGS -->
      <section id="view-settings" style="display:none">
        <div class="screen-header">
          <div style="display:flex;align-items:center;gap:8px">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <h1>Ustawienia</h1>
          </div>
        </div>
        <div class="card settings-section">
          <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Użytkownicy
          </h3>
          <div id="settings-users"></div>
        </div>
        <div class="card settings-section">
          <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/><line x1="6" y1="17" x2="18" y2="17"/></svg>
            Sprzęt w kuchni
          </h3>
          <div id="settings-appliances" class="appliance-grid"></div>
        </div>
        <div class="card settings-section">
          <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><path d="M17 21V7L8 3v14"/><path d="M8 17a2 2 0 0 1-2 2"/><path d="M14 17a2 2 0 0 1-2 2"/></svg>
            Razem czy osobno?
          </h3>
          <div class="toggle">
            <input type="checkbox" id="cook-together" onchange="app.settings.toggleCookTogether()">
            <span class="toggle-slider"></span>
            <span id="cook-together-label">Gotujecie razem</span>
          </div>
        </div>
        <div class="card settings-section">
          <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Dane
          </h3>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <button class="btn-sm" onclick="app.settings.resetAll()">Resetuj wszystko</button>
            <button class="btn-sm" onclick="app.settings.exportData()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:2px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Eksport
            </button>
            <input type="file" id="import-file" accept=".json" style="display:none" onchange="app.settings.importData(event)">
            <button class="btn-sm" onclick="document.getElementById('import-file').click()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:2px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              Import
            </button>
          </div>
        </div>
      </section>
    </div>

    <!-- Floating Bottom Nav -->
    <nav class="floating-nav">
      <button class="nav-btn active" data-view="dashboard" aria-label="Plan">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span class="nav-label">Plan</span>
      </button>
      <button class="nav-btn" data-view="mealplan" aria-label="Kalendarz">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/>
        </svg>
        <span class="nav-label">Kalendarz</span>
      </button>
      <button class="nav-btn" data-view="pantry" aria-label="Przepisy">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/>
          <line x1="6" y1="17" x2="18" y2="17"/>
        </svg>
        <span class="nav-label">Przepisy</span>
      </button>
      <button class="nav-btn" data-view="water" aria-label="Woda">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
        </svg>
        <span class="nav-label">Woda</span>
      </button>
      <button class="nav-btn" data-view="settings" aria-label="Ustawienia">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span class="nav-label">Ustawienia</span>
      </button>
    </nav>
  </div>

  <!-- Modals -->
  <div id="modal-overlay" class="modal-overlay" onclick="app.ui.closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button class="modal-close" onclick="app.ui.closeModal()">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Water Toast -->
  <div id="water-toast" class="toast">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5297C7" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
    <span>Wypij pół szklanki wody!</span>
    <button onclick="app.water.dismissToast()">✓</button>
  </div>
</div>

<script src="app.js"></script>
<script>
(function() {
  var checkApp = function() {
    if (typeof app !== 'undefined' && app.init) {
      try {
        app.init();
        console.log('App initialized successfully');
      } catch(e) {
        console.error('App init error:', e);
        document.getElementById('dash-users').innerHTML = '<div class="card empty-state"><p>Błąd: ' + e.message + '</p></div>';
      }
    } else {
      setTimeout(checkApp, 200);
    }
  };
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', checkApp);
  } else {
    checkApp();
  }
})();
</script>
</body>
</html>
